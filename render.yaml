services:
  - type: web
    name: finguard-api
    runtime: node
    buildCommand: npm ci && npm run build --workspace packages/shared && npm run build --workspace apps/api
    startCommand: npm --workspace apps/api start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_BASE_URL
        value: https://finguard-web.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_SERVICE_BASE_URL
        value: https://finguard-ai.onrender.com
      - key: AI_SERVICE_URL
        value: https://finguard-ai.onrender.com/api/v1

  - type: web
    name: finguard-ai
    runtime: python
    buildCommand: cd services/ai && pip install -r requirements.txt
    startCommand: cd services/ai && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: finguard-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace packages/shared && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://finguard-api.onrender.com/api/v1
      - key: VITE_DEMO_MODE_ENABLED
        value: "false"
